# Netlify picks these up automatically. The two VITE_SUPABASE_* values
# still go in Site settings → Environment variables — never in the repo.
[build]
  # The app builds from the repo root (index.html, vite.config.js and src/
  # are all here). Pinned explicitly because the dashboard's "Base
  # directory" setting names a folder that isn't in this repo, which failed
  # every deploy at the config-parsing stage. This value wins over the UI.
  base = "."
  command = "npm install --allow-remote=all && npm run build"
  publish = "dist"

# The service worker must never be cached by the browser, or a tablet can
# stay stuck on an old version of the app after a deploy.
[[headers]]
  for = "/sw.js"
  [headers.values]
    Cache-Control = "no-cache"
