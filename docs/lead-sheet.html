<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Department Lead Sheet</title>
<!--
  The paper version of the department tablet, one letter page per
  department, for the weeks before the tablets arrive. The TVs are run
  from the office desk, so this sheet is how a lead's numbers reach
  them: the lead fills it in on the floor, the office reads it at each
  check-in time and keys it in.

  It follows the tablet on purpose — same order, same words (Start /
  Done / Blocked), same check-in times, same reason list — so the habit
  is already there on the day a tablet replaces it.

  Print: open in Chrome → Print → Letter, margins Default, "Background
  graphics" on. Each department starts on its own page. To change a
  department's jobs or stations, edit DEPARTMENTS in the script below.
-->
<style>
  :root{
    --ink:#14181C; --ink2:#3C434B; --mute:#666E78; --line:#9C978D; --faint:#CFCAC0;
    --rail:#F1EEE8; --safety:#B37D00; --safety-bg:#FFF4D6; --red:#B31F26; --red-bg:#FBE6E6;
    --green:#1F6B37; --green-bg:#E3F2E7;
    --display:"Arial Narrow","Barlow Condensed",Haettenschweiler,sans-serif;
    --body:"Segoe UI",Calibri,Arial,sans-serif;
  }
  *{box-sizing:border-box}
  html,body{margin:0;background:var(--rail);color:var(--ink);font-family:var(--body);font-size:9.5pt;line-height:1.3}
  .sheet{background:#fff;width:8.5in;height:11in;margin:16px auto;padding:0.42in 0.45in;display:flex;flex-direction:column;gap:9px;overflow:hidden;box-shadow:0 2px 14px rgba(0,0,0,.18)}
  @page{size:letter;margin:0}
  @media print{
    html,body{background:#fff}
    .sheet{margin:0;box-shadow:none;break-after:page}
    .sheet:last-child{break-after:auto}
  }
  h1{font-family:var(--display);text-transform:uppercase;font-weight:700;font-size:34pt;line-height:.9;margin:0;letter-spacing:-.01em}
  h2{font-family:var(--display);text-transform:uppercase;font-size:11.5pt;letter-spacing:.06em;margin:0 0 4px;display:flex;justify-content:space-between;align-items:baseline}
  h2 small{font-family:var(--body);text-transform:none;letter-spacing:0;font-size:8pt;font-weight:400;color:var(--mute)}

  .top{display:grid;grid-template-columns:1fr auto;gap:14px;align-items:end;border-bottom:3px solid var(--ink);padding-bottom:7px}
  .kicker{font-size:8pt;letter-spacing:.14em;text-transform:uppercase;color:var(--mute);font-weight:700}
  .fields{display:grid;grid-template-columns:auto auto auto;gap:4px 14px;font-size:9pt}
  .field{display:flex;align-items:flex-end;gap:5px;white-space:nowrap}
  .field b{font-weight:600}
  .blank{display:inline-block;border-bottom:1px solid var(--ink);height:1.15em}

  .rules{display:grid;grid-template-columns:repeat(4,1fr);gap:6px}
  .rule{border:1.5px solid var(--ink);border-radius:6px;padding:5px 7px;font-size:8.3pt;line-height:1.25}
  .rule > b:first-child{display:block;font-family:var(--display);text-transform:uppercase;font-size:11pt;letter-spacing:.02em;margin-bottom:1px}
  .rule.start > b:first-child{color:var(--safety)} .rule.done > b:first-child{color:var(--green)} .rule.block > b:first-child{color:var(--red)}

  table{border-collapse:collapse;width:100%}
  th,td{border:1px solid var(--line)}
  th{background:var(--ink);color:#fff;font-weight:600;font-size:7.8pt;text-transform:uppercase;letter-spacing:.03em;padding:3px 3px;line-height:1.1}
  th.job{border-left:2.5px solid #fff}
  .orders td{height:0.285in;padding:0 4px;font-size:8.5pt}
  .orders td.num{width:0.34in;text-align:center;font-family:var(--display);font-weight:700;font-size:11pt}
  .orders td.box{width:0.34in;text-align:center;color:var(--faint);font-size:7pt}
  .orders td.box.first{border-left:2.5px solid var(--ink2)}
  .orders td.reason{width:0.95in}
  .orders tr:nth-child(even) td{background:#FAF8F4}
  .orders td.box, .orders tr:nth-child(even) td.box{background:#fff}
  th.sub{background:#3C434B;font-size:7pt;padding:2px}

  .bottom{display:grid;grid-template-columns:1.25fr 1fr;gap:10px;margin-top:auto}
  .counts td{height:0.3in;text-align:center}
  .counts td.st{text-align:left;padding:0 5px;font-weight:600;font-size:8.5pt;white-space:nowrap}
  .counts th.time{width:0.62in}
  .counts .note{font-size:7.8pt;color:var(--mute);margin-top:3px}
  .codes{border:1.5px solid var(--red);border-radius:6px;padding:6px 8px;background:var(--red-bg)}
  .codes ol{margin:0;padding:0;list-style:none;columns:2;column-gap:10px;font-size:8.2pt;line-height:1.35}
  .codes li b{display:inline-block;width:1.25em;font-family:var(--display);font-size:10pt;color:var(--red)}
  .codes .qc{margin-top:5px;padding-top:4px;border-top:1px solid #e3b5b5;font-size:8pt}
  .foot{display:flex;justify-content:space-between;font-size:7.8pt;color:var(--mute);border-top:1px solid var(--faint);padding-top:4px}
  .howto{max-width:8.5in;margin:20px auto 0;padding:12px 16px;background:#fff;border-left:5px solid var(--safety);font-size:13px}
  @media print{.howto{display:none}}
</style>
</head>
<body>
<div class="howto"><b>To print:</b> Chrome → Print → Paper <b>Letter</b>, Margins <b>Default</b>, tick <b>Background graphics</b>. One page per department. Hand each lead a fresh sheet every morning.</div>
<main id="pages"></main>

<script>
// Each department's jobs (the columns the tablet shows on each order card)
// and the stations it counts at check-in. Same names as the app.
const DEPARTMENTS = [
  { name: 'Mods',  jobs: ['Mods'], stations: ['Framing (frames)', 'Staging (finished mods)'], unit: 'mods' },
  { name: 'V4T',   jobs: ['V4T', 'Vin. Fix', 'Vin. Trap'], stations: ['Vents cut', 'Vents built & glazed', 'Frames built & squared'], unit: 'inserts' },
  { name: 'Track', jobs: ['Track'], stations: ['Tracks done'], unit: 'tracks' },
  { name: 'Panel', jobs: ['Roof Panels', 'Roof Extr.', 'Acrylic', 'Filler'], stations: ['Roof panels', 'Mod filler panels', 'Acrylic panels'], unit: 'panels', note: 'Each bench counts its own panels.' },
  { name: 'Door',  jobs: ['Doors'], stations: ['Doors done'], unit: 'doors' },
]
const CHECKINS = ['9:30', '11:30', '1:30', '4:00']
// Same list, same order as the tablet's "report a problem" picker.
const BLOCKS = ['Material shortage', 'Machine down', 'Rework / wrong cut', 'Waiting on another dept', 'Missing info / paperwork', 'Short-staffed', 'Order change', 'Other — write it']
const ROWS = 20

const esc = (s) => String(s).replace(/[&<>]/g, (c) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;' })[c])

function sheet(d) {
  const jobHead = d.jobs.map((j) => `<th class="job" colspan="2">${esc(j)}</th>`).join('')
  const jobSub = d.jobs.map(() => `<th class="sub">Start</th><th class="sub">Done</th>`).join('')
  const jobCells = d.jobs.map(() => `<td class="box first"></td><td class="box"></td>`).join('')
  const rows = Array.from({ length: ROWS }, (_, i) => `<tr><td class="num">${i + 1}</td><td></td>${jobCells}<td class="reason"></td></tr>`).join('')
  const counts = d.stations.map((s) => `<tr><td class="st">${esc(s)}</td>${CHECKINS.map(() => '<td></td>').join('')}</tr>`).join('')
  const codes = BLOCKS.map((b, i) => `<li><b>${i + 1}</b>${esc(b)}</li>`).join('')
  return `
  <section class="sheet">
    <div class="top">
      <div>
        <div class="kicker">Sunspace Truesdale · Lead sheet</div>
        <h1>${esc(d.name)}</h1>
      </div>
      <div class="fields">
        <span class="field"><b>Date</b><span class="blank" style="width:0.85in"></span></span>
        <span class="field"><b>Lead</b><span class="blank" style="width:1.05in"></span></span>
        <span class="field"><b>Crew today</b><span class="blank" style="width:0.4in"></span></span>
        <span class="field"><b>Pickup</b><span class="blank" style="width:0.85in"></span></span>
        <span class="field" style="grid-column:span 2"><b>To finish today</b><span class="blank" style="width:0.4in"></span><span style="color:var(--mute)">orders</span></span>
      </div>
    </div>

    <div class="rules">
      <div class="rule"><b>1 · In order</b>Build #1, then #2, then #3 — the office sets the order. Don't skip ahead.</div>
      <div class="rule start"><b>2 · Start</b>Write the time in <b>Start</b> the moment you begin a job.</div>
      <div class="rule done"><b>3 · Done</b>Write the time in <b>Done</b> when it's finished — not later, not in a batch.</div>
      <div class="rule block"><b>4 · Stuck?</b>Write the <b>code</b> below in Problem and <b>tell the office right away</b>. Don't wait for the check-in.</div>
    </div>

    <div>
      <h2>Today's orders <small>Copy tag names in build order from the office list. Write the time, e.g. 9:40.</small></h2>
      <table class="orders">
        <thead>
          <tr><th rowspan="2">#</th><th rowspan="2" style="text-align:left">Tag name</th>${jobHead}<th rowspan="2">Problem<br>code</th></tr>
          <tr>${jobSub}</tr>
        </thead>
        <tbody>${rows}</tbody>
      </table>
    </div>

    <div class="bottom">
      <div class="counts">
        <h2>Count check-ins <small>How many ${esc(d.unit)} done so far today</small></h2>
        <table>
          <thead><tr><th style="text-align:left">Station</th>${CHECKINS.map((t) => `<th class="time">${t}</th>`).join('')}</tr></thead>
          <tbody>${counts}</tbody>
        </table>
        <div class="note">Running total since the start of the shift, not since the last check-in. The office collects it at each time and updates the TV.${d.note ? ' ' + esc(d.note) : ''}</div>
      </div>
      <div class="codes">
        <h2 style="color:var(--red)">Problem codes</h2>
        <ol>${codes}</ol>
        <div class="qc"><b>Bad part from another department?</b> Write <b>Q</b>, the department and what's wrong (e.g. <i>Q · Panel · 2" short</i>), and bring it to the office.</div>
      </div>
    </div>

    <div class="foot"><span>Hand this sheet to the office at the end of the shift.</span><span>Signed ____________________</span></div>
  </section>`
}

document.getElementById('pages').innerHTML = DEPARTMENTS.map(sheet).join('')
</script>
</body>
</html>
